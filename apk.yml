name: Crear APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar la app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png www/
      - name: Instalar dependencias
        run: npm install
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Iconos, nombre, versión y orientación
        run: |
          pip install pillow
          python3 android_setup.py android icon-512.png
      - name: Copiar la app
        run: npx cap sync android
      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Firmar la APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > signing.keystore
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$APK" aligned.apk
          $BT/apksigner sign --ks signing.keystore --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out ADCEYA.apk aligned.apk
          $BT/apksigner verify ADCEYA.apk
          rm -f signing.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: ADCEYA-apk
          path: ADCEYA.apk
