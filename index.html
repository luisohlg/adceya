<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E2A6B">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ADCEYA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>ADCEYA</title>
<style>
/* Diseño: mostrador de taller. Placa amarilla de seguridad sobre asfalto y concreto, franja de peligro como único adorno, títulos en condensada de señal vial y cifras en monoespaciada como etiqueta de pieza. Una columna con barra de pestañas abajo. */
:root{
  --bg:#E2E3E0; --surface:#F3F4F1; --surface-2:#D3D5D1; --fg:#14161A; --muted:#555B62; --line:#C4C7C2; --edge:#868B92;
  --accent:#FFC400; --accent-fg:#14161A; --stripe:#14161A;
  --good:#1B7A4B; --good-bg:#D9EFE2; --warn:#8F4F00; --warn-bg:#FADFBF; --bad:#B3261E; --bad-bg:#F8D7D4;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  background:var(--bg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101113; --surface:#1A1C1F; --surface-2:#25282C; --fg:#ECECEA; --muted:#9BA0A7; --line:#2E3237; --edge:#5C626A;
    --accent:#FFC400; --accent-fg:#14161A; --stripe:#000000;
    --good:#5CCB92; --good-bg:#12301F; --warn:#F0B35A; --warn-bg:#3A2A0B; --bad:#FF8F86; --bad-bg:#3C1816;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101113; --surface:#1A1C1F; --surface-2:#25282C; --fg:#ECECEA; --muted:#9BA0A7; --line:#2E3237; --edge:#5C626A;
  --accent:#FFC400; --accent-fg:#14161A; --stripe:#000000;
  --good:#5CCB92; --good-bg:#12301F; --warn:#F0B35A; --warn-bg:#3A2A0B; --bad:#FF8F86; --bad-bg:#3C1816;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.wrap.noNav{padding-bottom:40px}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.sec{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.logo-mark{flex:none;display:block}
.lg-bg{fill:var(--accent)}
.lg-ring{fill:none;stroke:var(--accent-fg);stroke-width:2.2}
.lg-bolt{fill:var(--accent-fg)}
.hazard{height:8px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--accent) 0 9px,var(--stripe) 9px 18px)}

/* encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 16px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 9px,var(--stripe) 9px 18px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.shop{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page{display:flex;flex-direction:column;gap:14px;padding-top:18px}

/* botones y campos */
.btn{min-height:46px;padding:0 16px;border-radius:6px;border:2px solid var(--edge);background:var(--surface);color:var(--fg);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.search{min-height:48px;width:100%;padding:0 12px;border:2px solid var(--edge);border-radius:6px;background:var(--surface);color:var(--fg);font-size:16px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields2>*{min-width:0}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:-4px 0 10px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.bar{display:flex;gap:10px}
.bar .search{flex:1;min-width:0}

/* filtros por tipo */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border:2px solid var(--edge);border-radius:6px;background:var(--surface);color:var(--fg);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[disabled]{opacity:.45;cursor:not-allowed}

/* resumen */
.stats{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,.8fr) minmax(0,1.5fr);border:1px solid var(--edge);border-radius:6px;background:var(--surface);overflow:hidden}
.st{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.st:last-child{border-right:0}
.st span{display:block;font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.st b{display:block;font-family:var(--mono);font-weight:500;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.st b.warn{color:var(--warn)}

/* placa del total */
.total{position:relative;background:var(--accent);color:var(--accent-fg);border:2px solid var(--accent-fg);border-radius:8px;padding:14px 16px 22px;overflow:hidden}
.total::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(-45deg,var(--accent-fg) 0 8px,var(--accent) 8px 16px)}
.total small{display:block;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.total .big{font-family:var(--mono);font-weight:500;font-size:30px;line-height:1.2;overflow-wrap:anywhere}
.total .cc{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.08em}
.total .sub{font-size:14px;font-weight:500}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav .lbl{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase}

/* listas */
.list{background:var(--surface);border:1px solid var(--edge);border-radius:6px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;color:inherit;font:inherit;min-height:58px}
.row:last-child{border-bottom:0}
button.row{cursor:pointer}
button.row:active{background:var(--surface-2)}
button.row.dis{opacity:.5;cursor:not-allowed}
.grow{flex:1;min-width:0}
.nm{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--fg);border:1px solid var(--edge);border-radius:3px;padding:0 5px;margin-right:6px;line-height:1.5;vertical-align:1px}
.right{text-align:right;flex:none}
.right .num{font-size:18px}
.badge{display:inline-block;font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:3px;margin-top:2px}
.b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-good{background:var(--good-bg);color:var(--good)}
.empty{border:2px dashed var(--edge);border-radius:6px;padding:18px 16px;color:var(--muted);text-align:center}
.void .nm,.void .num{text-decoration:line-through;color:var(--muted)}
.note{border-radius:6px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.info{background:var(--surface-2);color:var(--muted)}

/* barra de pestañas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--edge);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;border:0;background:none;color:var(--muted);font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.01em;text-transform:uppercase;border-radius:6px;cursor:pointer;min-width:0;padding:0 1px}
.nav button.on{background:var(--accent);color:var(--accent-fg)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* hoja modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,10,12,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border-top:5px solid var(--accent);border-radius:10px 10px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;margin-bottom:4px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stepper .btn{padding:0;font-size:24px}
.stepper input{text-align:center;font-family:var(--mono);font-size:20px}
.sumline{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 14px;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sumline .num{font-size:22px;letter-spacing:0}
textarea.copybox{width:100%;min-height:160px;padding:10px;border:2px solid var(--edge);border-radius:6px;background:var(--surface);color:var(--fg);font:12px var(--mono)}

/* acceso */
.auth{display:flex;flex-direction:column;gap:14px;padding:max(36px,7vh) 0 24px}
.auth .logo{display:flex;align-items:center;gap:14px}
.auth h1{font-size:44px}
.auth .lead{color:var(--muted);max-width:46ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* fila de trabajador con acción */
button.rowbtn{background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.row .badge{flex:none;margin:0}
.right.num{line-height:1.3}


/* ---- v7: contraseña, fotos, colores, carrito, billetes ---- */
.note.ok{background:var(--good-bg);color:var(--good)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.sb.void{text-decoration:line-through}

/* mostrar contraseña */
.pwwrap{position:relative;display:block}
.pwwrap input{padding-right:52px}
.pwbtn{position:absolute;top:2px;right:2px;bottom:2px;width:46px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px}
.pwbtn[aria-pressed=true]{color:var(--fg)}

/* miniaturas, colores, foto */
.thumb{width:46px;height:46px;border-radius:6px;object-fit:cover;border:1px solid var(--edge);background:var(--surface-2);flex:none;display:block}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:2px solid var(--edge);background:var(--surface-2);display:block;margin-bottom:10px}
.photo.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--edge);display:inline-block}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--edge);cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
.sw.on{outline:3px solid var(--fg);outline-offset:2px}

/* venta con varios productos */
.cart{border:2px solid var(--fg);border-radius:8px;background:var(--surface);padding:12px}
.cart .chips{padding-top:0}
.cartrow .nm{font-size:16px}
.qtybox{display:flex;align-items:center;gap:6px;flex:none}
.qtybox .btn{padding:0;width:38px;font-size:20px}
.qin{width:58px;min-height:38px;text-align:center;border:2px solid var(--edge);border-radius:6px;background:var(--surface);color:var(--fg);font:500 16px var(--mono)}
.btn.iconbtn{width:48px;padding:0;flex:none}
.btn.iconbtn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent-fg)}

/* contador de billetes */
.bills{border:2px solid var(--edge);border-radius:8px;background:var(--surface);padding:0 12px;margin:12px 0}
.bills summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.bills[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.billgrid{display:grid;grid-template-columns:auto 84px 1fr;gap:8px 12px;align-items:center;margin-bottom:10px}
.billgrid .bl{font-family:var(--mono);font-weight:500}
.billgrid input{min-height:42px;width:100%;text-align:center;border:2px solid var(--edge);border-radius:6px;background:var(--bg);color:var(--fg);font:500 16px var(--mono)}
.billgrid .bs{text-align:right;color:var(--muted)}

/* editar venta */
.fields3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.fields3>*{min-width:0}
.eline{border:1px solid var(--edge);border-radius:6px;padding:10px 10px 0;margin-bottom:10px;background:var(--surface)}
.eline.void{opacity:.6;padding-bottom:10px}
.row.sale{align-items:flex-start}
.row.sale .sb{white-space:normal}

/* v7 */
.nav.six{padding-left:max(2px,env(safe-area-inset-left,0px));padding-right:max(2px,env(safe-area-inset-right,0px))}
.nav.six button{font-size:9.5px;letter-spacing:-.01em;padding:0;overflow:hidden}
.nav.six .nav-in{gap:0}
.nav.six svg{width:21px;height:21px}
.chips.sm{padding:0 0 4px;gap:6px}
.chips.sm .chip{min-height:34px;padding:0 12px;font-size:14px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent);color:var(--accent-fg);border:2px solid var(--accent-fg);border-radius:8px;padding:7px 12px}
.mini small{display:block;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.mini .num{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.mini .sub{font-size:12px;font-weight:500;text-align:right;flex:none}
.monthnav.sm .lbl{font-size:18px}
.cartfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.cartfoot .tot{font-family:var(--mono);font-weight:500;font-size:20px;text-align:right;overflow-wrap:anywhere}
.cart .row{min-height:48px;padding:6px 10px}
.cart .btn.sm{min-height:34px}
.qin.over,input.over{border-color:var(--bad)!important;color:var(--bad);background:var(--bad-bg)}
.sb.bad,.small.bad{color:var(--bad);font-weight:600;white-space:normal}
.field .hint.bad{color:var(--bad);font-size:13px;font-weight:600}
.billgrid.tight{gap:5px 12px}
.billgrid.tight input{min-height:36px}
.pbtns .btn{font-size:15px;white-space:nowrap;padding:0 8px}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav-bills{color:var(--fg)!important}
.copybox.tall{min-height:300px}
.sharebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

:root{
  --bg:#EDF1F6;--surface:#FFFFFF;--surface-2:#E2E8F0;--fg:#0E1B3D;--muted:#4F5B75;--line:#D6DDE8;--edge:#98A5BB;
  --accent:#1565E0;--accent-fg:#FFFFFF;--accent-soft:#DCE8FD;--accent-ink:#0B4BB3;--green:#3FAE3A;--stripe:#0E2A6B;
  --good:#17753A;--good-bg:#DCF2E3;--warn:#8A5200;--warn-bg:#FCE8C9;--bad:#B3261E;--bad-bg:#FBDAD7;
  --plate:linear-gradient(135deg,#0E2A6B 0%,#1252C4 100%);
  --display:'Montserrat','Segoe UI',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.23,1,.32,1);background:var(--bg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1226;--surface:#111C38;--surface-2:#1A2748;--fg:#EAF0FF;--muted:#A2AFCB;--line:#243459;--edge:#4B5E88;
    --accent:#4B8BFF;--accent-fg:#06122B;--accent-soft:#1A2D55;--accent-ink:#9DC0FF;--green:#5FCB5A;--stripe:#000;
    --good:#6AD493;--good-bg:#10301D;--warn:#F0B35A;--warn-bg:#3A2A0B;--bad:#FF9088;--bad-bg:#3C1816;
    --plate:linear-gradient(135deg,#12306E 0%,#1B5BD0 100%);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1226;--surface:#111C38;--surface-2:#1A2748;--fg:#EAF0FF;--muted:#A2AFCB;--line:#243459;--edge:#4B5E88;
  --accent:#4B8BFF;--accent-fg:#06122B;--accent-soft:#1A2D55;--accent-ink:#9DC0FF;--green:#5FCB5A;--stripe:#000;
  --good:#6AD493;--good-bg:#10301D;--warn:#F0B35A;--warn-bg:#3A2A0B;--bad:#FF9088;--bad-bg:#3C1816;
  --plate:linear-gradient(135deg,#12306E 0%,#1B5BD0 100%);color-scheme:dark;
}
body{font-family:var(--body)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.15;letter-spacing:.01em}
.sec{font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.1em}
.hazard{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--green))}
.top{padding:8px 0 12px;gap:8px}
.top::after{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) 0,var(--green) 100%)}
.brandlogo{width:56px;height:42px;object-fit:contain;flex:none;border-radius:10px;background:#DCE0E3;display:block}
.shop{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.02em}
.who{font-size:12px}
.topbtns{display:flex;gap:6px;align-items:center;flex:none}
.topbtns .btn{min-height:44px}
.btn{min-height:48px;border-radius:12px;border:1.5px solid var(--edge);font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;transition:transform .12s var(--ease),background-color .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{min-height:44px;padding:0 14px;font-size:12.5px}
.btn.iconbtn{width:48px;padding:0}
.btn.iconbtn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.topbtns .btn.iconbtn{width:44px}
.chip{min-height:44px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.04em;border:1.5px solid var(--edge);transition:transform .12s var(--ease)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips.sm .chip{min-height:44px;padding:0 12px;font-size:12px}
.field label{font-family:var(--display);font-size:11.5px;letter-spacing:.08em}
.field input,.field select,.search{min-height:48px;border-radius:12px;border:1.5px solid var(--edge)}
.list{border-radius:14px;border:1px solid var(--line)}
.row{min-height:60px}
.nm{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:16px;line-height:1.25}
.badge{font-family:var(--display);font-size:10.5px;letter-spacing:.06em}
.monthnav .lbl,.monthnav.sm .lbl{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.02em}
.sumline{font-family:var(--display);font-size:13px;letter-spacing:.06em}
.sumline .num{font-size:20px}
.total,.mini{background:var(--plate);color:#fff;border:0;border-radius:16px}
.total{padding:16px 18px 24px}
.total::after{height:4px;background:linear-gradient(90deg,var(--green),#3FA9FF 60%,transparent)}
.total small,.mini small{font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.1em}
.total .big{font-size:28px}
.total .cc{font-family:var(--display);font-size:13px;letter-spacing:.08em;opacity:.9}
.total .sub{font-size:13px;opacity:.92}
.mini .num{font-size:16px}
.mini .sub{opacity:.92}
.stats{grid-template-columns:1fr 1fr 1.7fr;border-radius:14px;border:1px solid var(--line)}
.st{padding:10px}
.st span{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none}
.st b{font-size:14px}
.nav{border-top:1px solid var(--line);background:var(--surface)}
.nav button{min-height:58px;border-radius:12px;font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);gap:2px;transition:background-color .15s}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink)}
.nav svg{width:24px;height:24px}
.sheet{border-top:0;border-radius:20px 20px 0 0}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--edge);margin:-6px auto 12px;opacity:.6}
.sheet h2{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.01em}
.toast{top:calc(env(safe-area-inset-top,0px) + 74px);bottom:auto;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(8,16,40,.28)}
@media (prefers-reduced-motion:no-preference){.toast:not([hidden]){animation:tin .18s var(--ease)}@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}}
.logocard{background:#E9EEF1;border-radius:22px;padding:6px;display:flex;justify-content:center;box-shadow:0 1px 0 var(--line)}
.logocard img{width:min(100%,300px);height:auto;display:block}
.auth{gap:16px;padding:max(24px,5vh) 0 24px}
.thumb{width:48px;height:48px;border-radius:12px}
.thumb.ph{background:var(--accent-soft);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:18px;border-color:transparent}
.uds{font-size:11px;color:var(--muted);text-align:right}
.total .big,.mini .num,.total .cc{color:#fff}
.qin{min-height:44px;border-radius:12px}
.qtybox .btn{width:44px}
.pbtns .btn{font-size:13px}
.cart{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:12px}
.qtybox{gap:4px}
.qtybox .btn{width:40px;min-height:44px}
.qin{width:48px}
.cartrow .sb{white-space:normal}
.cartrow{gap:8px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.duo .logocard{padding:4px;border-radius:18px;align-items:center;height:100%}
.duo .logocard img{width:100%;height:auto}
.duo .jugcard{background:#CDB59D}
.pick{gap:14px}
.pick .lead{margin-top:6px}
.storebtn{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:12px 12px 14px;border-radius:20px;border:1.5px solid var(--edge);cursor:pointer;font-family:var(--display);transition:transform .12s var(--ease)}
.storebtn:active{transform:scale(.98)}
.storebtn img{width:min(100%,250px);height:auto;display:block;border-radius:14px}
.storebtn .sbt{font-weight:800;font-size:17px;line-height:1.2;text-align:center}
.storebtn .sbs{font-family:var(--body);font-size:13px;opacity:.8}
.sb-moto{background:#E9EEF1;color:#0E2A6B}
.sb-jug{background:#CDB59D;color:#3A2620}
.brandbtn{background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;cursor:pointer;min-height:44px}
.brandbtn .who{text-decoration:underline;text-decoration-color:var(--edge);text-underline-offset:3px}
/* contador de billetes */
.billrows{display:flex;flex-direction:column;gap:6px;align-items:center;margin:8px 0 12px}
.brow{display:grid;grid-template-columns:78px 84px 16px 100px;gap:8px;align-items:center;justify-content:center}
.brow .bl{font-family:var(--mono);font-weight:600;text-align:right;font-size:15px}
.brow input{min-height:44px;width:100%;text-align:center;border:1.5px solid var(--edge);border-radius:12px;background:var(--surface);color:var(--fg);font:600 17px var(--mono)}
.brow .eq{text-align:center;color:var(--muted);font:600 18px var(--mono)}
.brow .bs{text-align:left;color:var(--fg);font-size:16px;font-weight:600}
.bills summary svg{margin-right:8px;flex:none}
.sheet.full{max-height:none;height:100%;border-radius:0;display:flex;flex-direction:column;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.sheet.full::before{display:none}
.sheet.full .billrows{flex:1;min-height:0;overflow-y:auto;justify-content:flex-start;gap:4px;margin:6px 0 0}
.toolhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.toolhead h2{margin:0;flex:1;min-width:0;font-size:17px}
.toolhead .btn{flex:none}
.sheet.full .sumline{margin:0 0 6px;align-items:center}
.sumline.cmp label{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.sumline.cmp label small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-family:var(--body);margin-left:4px}
.cmpbox{display:inline-flex;align-items:baseline;gap:6px;font-size:20px;font-weight:700}
.cmpbox input{width:11ch;min-height:40px;text-align:right;font:700 20px var(--mono);border:1.5px solid var(--edge);border-radius:10px;background:var(--surface);color:var(--fg);padding:0 8px}
.sheet.full .note{margin-bottom:4px;min-height:36px;padding:7px 12px;font-size:13px;display:flex;align-items:center}
/* cambio de precio en una venta */
.pchg{background:var(--warn-bg);color:var(--warn);border-left:4px solid var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.35;margin:6px 0;font-weight:600}
.pchg small{display:block;font-weight:500}
.row.sale{flex-wrap:wrap;row-gap:0}
.row.sale>.pchg{flex:1 1 100%;margin:2px 0 10px}
/* tema tienda de juguetes */
:root[data-store="jug"]{
  --bg:#F5EBDD;--surface:#FFFBF5;--surface-2:#EADBC6;--fg:#2B2438;--muted:#6B5E6F;--line:#E2D2BB;--edge:#B8A58D;
  --accent:#C8432B;--accent-fg:#FFFFFF;--accent-soft:#F8DBD1;--accent-ink:#9B2E1A;--green:#E9A93A;--stripe:#2C4A7A;
  --good:#17753A;--good-bg:#DCF2E3;--warn:#8A5200;--warn-bg:#FCE8C9;--bad:#A3182A;--bad-bg:#FBDAD7;
  --plate:linear-gradient(135deg,#2C4A7A 0%,#3C7C93 100%);
  --display:'Fredoka','Montserrat','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root[data-store="jug"]:not([data-theme="light"]){
    --bg:#1D1826;--surface:#282133;--surface-2:#342B42;--fg:#F5ECE4;--muted:#B9AEBF;--line:#3C3249;--edge:#6A5C7C;
    --accent:#F0684C;--accent-fg:#2A0D07;--accent-soft:#4A2A28;--accent-ink:#FFB8A6;--green:#F2BE55;--stripe:#000;
    --good:#6AD493;--good-bg:#10301D;--warn:#F0B35A;--warn-bg:#3A2A0B;--bad:#FF9088;--bad-bg:#3C1816;
    --plate:linear-gradient(135deg,#2E4C7E 0%,#3C8099 100%);color-scheme:dark;
  }
}
:root[data-store="jug"][data-theme="dark"]{
  --bg:#1D1826;--surface:#282133;--surface-2:#342B42;--fg:#F5ECE4;--muted:#B9AEBF;--line:#3C3249;--edge:#6A5C7C;
  --accent:#F0684C;--accent-fg:#2A0D07;--accent-soft:#4A2A28;--accent-ink:#FFB8A6;--green:#F2BE55;--stripe:#000;
  --good:#6AD493;--good-bg:#10301D;--warn:#F0B35A;--warn-bg:#3A2A0B;--bad:#FF9088;--bad-bg:#3C1816;
  --plate:linear-gradient(135deg,#2E4C7E 0%,#3C8099 100%);color-scheme:dark;
}
:root[data-store="jug"] .brandlogo{background:#CDB59D}
:root[data-store="jug"] .btn,:root[data-store="jug"] .chip,:root[data-store="jug"] .field input,:root[data-store="jug"] .field select,:root[data-store="jug"] .search{border-radius:16px}
:root[data-store="jug"] .list{border-radius:18px}
:root[data-store="jug"] .total,:root[data-store="jug"] .mini{border-radius:22px}
:root[data-store="jug"] .total::after{background:linear-gradient(90deg,var(--green),#F4C86A 60%,transparent)}
:root[data-store="jug"] .thumb{border-radius:16px}
:root[data-store="jug"] .nav button{border-radius:16px}
:root[data-store="jug"] h1,:root[data-store="jug"] .shop{letter-spacing:.01em}

/* ===== v11 · pautas de interfaz (Web Interface Guidelines) ===== */
html{-webkit-tap-highlight-color:transparent}
button,a,input,select,summary,textarea,.chip,[data-act]{touch-action:manipulation}
.scrim,.sheet{overscroll-behavior:contain}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-80px;z-index:100;background:var(--accent);color:var(--accent-fg);padding:12px 16px;border-radius:12px;font-weight:700;text-decoration:none}
.skip:focus{top:max(12px,env(safe-area-inset-top,0px))}
#app:focus{outline:none}
.btn.sm{min-width:44px}
.cmpbox input{min-height:44px}

/* ===== v1.0.1 · logos nuevos ===== */
.hero{border-radius:20px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 8px 24px -12px rgba(14,42,107,.35);background:#DCE0E3}
.hero img{display:block;width:100%;height:auto}
.contact{text-align:center;margin:-4px 0 2px}
.contact .addr{margin:0 0 4px;font-size:14px;color:var(--muted)}
.contact .tels{margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:0 8px}
.auth .lead{font-size:16px;line-height:1.5}
.contact a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--accent-ink,var(--fg));text-decoration:underline;text-underline-offset:3px}
.logocard,.sb-moto,.brandlogo{background:#DCE0E3}
.duo .jugcard,.sb-jug,:root[data-store="jug"] .brandlogo{background:#CBB7A2}
.storebtn img{border-radius:14px}

.storebtn{flex-direction:row;text-align:left;gap:14px;padding:10px 14px 10px 10px}
.storebtn img{width:112px;height:auto;flex:none}
.storebtn .sbt{text-align:left;font-size:16px}
.storebtn .sbs{display:block;margin-top:4px}
.storebtn .sbtx{display:flex;flex-direction:column;min-width:0;flex:1}
.note.bk{padding:8px 12px;font-size:13.5px;margin-bottom:8px}

/* ===== v1.0.2 ===== */
.brow{grid-template-columns:minmax(50px,62px) 38px minmax(40px,1fr) 38px 12px minmax(60px,90px);gap:4px}
.brow .bl{font-size:14px}
.bar{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border:1.5px solid var(--edge);background:var(--surface);color:#9AA3B2;border-radius:10px;cursor:pointer;justify-self:center}
.bar.dn.on{color:#D32F2F;border-color:#D32F2F;background:rgba(211,47,47,.10)}.bar.up.on{color:#2E9D3A;border-color:#2E9D3A;background:rgba(46,157,58,.12)}
.bar:active{background:rgba(127,127,127,.18)}
@media (prefers-color-scheme:dark){.bar{color:#6F7890}.bar.dn.on{color:#FF6B6B;border-color:#FF6B6B;background:rgba(255,107,107,.14)}.bar.up.on{color:#5FD17A;border-color:#5FD17A;background:rgba(95,209,122,.14)}}
:root[data-theme=dark] .bar{color:#6F7890}:root[data-theme=dark] .bar.dn.on{color:#FF6B6B;border-color:#FF6B6B;background:rgba(255,107,107,.14)}:root[data-theme=dark] .bar.up.on{color:#5FD17A;border-color:#5FD17A;background:rgba(95,209,122,.14)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;margin:6px 0 0;padding:0 2px;background:transparent;border:0;color:var(--muted);font:700 12.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-align:left}
.sechead .chev{font-size:16px;color:var(--fg)}
.total.tsum{padding-top:12px}
.tsum .tl{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:15px;font-weight:600;padding:3px 0}
.tsum .tv{text-align:right;font-family:var(--mono);font-weight:500;line-height:1.25}
.tsum .tsep{height:1px;background:currentColor;opacity:.35;margin:8px 0 10px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin:0 0 8px;font-size:15px;color:var(--fg)}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent)}

.cmpbox{min-width:0;flex:0 1 auto}.cmpbox input{width:10ch;min-width:0}
@media (max-width:340px){.sumline.cmp label small{display:block;margin-left:0}.cmpbox input{width:8.5ch;font-size:18px}.cmpbox{font-size:17px}}

/* v1.0.4 · importe a comparar en una sola línea */
.sumline.cmp{align-items:center;gap:8px}
.sumline.cmp label{flex:1 1 auto;min-width:0;white-space:nowrap;line-height:1.25;font-size:13px;letter-spacing:.04em}
.sumline.cmp label small{display:block;margin:2px 0 0;font-size:12px}
.cmpbox{flex:0 0 auto;align-items:center}
.cmpbox input{width:9.5ch;font-size:19px}
@media (max-width:360px){.sumline.cmp label{font-size:12px;letter-spacing:.02em}.cmpbox input{width:8.5ch;font-size:18px}.cmpbox{font-size:17px;gap:4px}}
</style>
</head>

function blank(){return {v:2,users:[],stores:{moto:blankStore('moto'),jug:blankStore('jug')}};}
function fixStore(d,k){
  (d.products||[]).forEach(function(p){
    if(!p.pr){p.pr={USD:0,CUP:0};p.pr[p.cur==='CUP'?'CUP':'USD']=Number(p.price)||0;}
    if(!p.pm)p.pm={USD:0,CUP:0};
    if(!Array.isArray(p.colors))p.colors=[];
  });
  ['products','moves','workers','payments','expenses'].forEach(function(n){if(!Array.isArray(d[n]))d[n]=[];});
  d.closed=d.closed&&typeof d.closed==='object'?d.closed:{};
  (d.workers||[]).forEach(function(w){if(!(Number(w.pct)>0))w.pct=0;});
  if(!(Number(d.pct)>=0)||d.pct===''||d.pct==null)d.pct=STORES[k].pct;
  if(!d.shop)d.shop='ADCEYA';
  return d;
}
function fixData(g){
  if(!g||typeof g!=='object')return blank();
  if(!g.stores){
    var users=Array.isArray(g.users)?g.users:[];delete g.users;delete g.v;delete g.photos;
    var moto=Object.assign(blankStore('moto'),g);
    g={v:2,users:users,stores:{moto:moto,jug:blankStore('jug')}};
    g.stores.jug.rate=moto.rate||0;
  }
  g.v=2;g.users=Array.isArray(g.users)?g.users:[];
  SKEYS.forEach(function(k){g.stores[k]=fixStore(Object.assign(blankStore(k),g.stores[k]||{}),k);});
  g.users.forEach(function(u){if(u.role!=='seller')u.store='both';else if(u.store!=='jug')u.store='moto';});
  return g;
}
function load(){
  try{var s=localStorage.getItem(KEY); if(s){return fixData(JSON.parse(s));}}
  catch(e){memOnly=true;}
  return blank();
}

var KEY_PH='inventario-fotos-v1';
function loadPhLS(){try{var t=localStorage.getItem(KEY_PH);if(t){var o=JSON.parse(t);if(o&&typeof o==='object')return o;}}catch(e){}return {};}
var PH={},PHdb=null,PHsaved={};
function idbOpen(){return new Promise(function(res){try{var r=indexedDB.open('adceya-fotos',1);r.onupgradeneeded=function(){r.result.createObjectStore('f');};r.onsuccess=function(){res(r.result);};r.onerror=r.onblocked=function(){res(null);};}catch(e){res(null);}});}
function loadPhAsync(){
  return idbOpen().then(function(db){
    var legacy=loadPhLS();PHdb=db;
    if(!db){PH=legacy;return;}
    return new Promise(function(res){
      var o={},tx;
      try{tx=db.transaction('f');}catch(e){PHdb=null;PH=legacy;res();return;}
      var c=tx.objectStore('f').openCursor();
      c.onsuccess=function(){var cur=c.result;if(cur){o[cur.key]=cur.value;cur.continue();}};
      tx.oncomplete=function(){
        var mig=false;Object.keys(legacy).forEach(function(k){if(!(k in o)){o[k]=legacy[k];mig=true;}});
        PH=o;PHsaved={};
        if(mig){savePh(function(ok){if(ok)try{localStorage.removeItem(KEY_PH);}catch(e){}});}
        else if(Object.keys(legacy).length){try{localStorage.removeItem(KEY_PH);}catch(e){}}
        else PHsaved=Object.assign({},PH);
        res();
      };
      tx.onerror=tx.onabort=function(){PH=legacy;res();};
    });
  });
}
function savePh(done){
  if(!PHdb){try{localStorage.setItem(KEY_PH,JSON.stringify(PH));if(done)done(true);return true;}catch(e){if(done)done(false);return false;}}
  try{
    var tx=PHdb.transaction('f','readwrite'),st=tx.objectStore('f'),next={};
    Object.keys(PH).forEach(function(k){next[k]=PH[k];if(PHsaved[k]!==PH[k])st.put(PH[k],k);});
    Object.keys(PHsaved).forEach(function(k){if(!(k in PH))st.delete(k);});
    tx.oncomplete=function(){PHsaved=next;if(done)done(true);};
    tx.onerror=tx.onabort=function(){if(done)done(false);else toast('No se pudieron guardar las fotos. Haz un respaldo.');};
    return true;
  }catch(e){if(done)done(false);return false;}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN;}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('es',{minimumFractionDigits:0,maximumFractionDigits:2,useGrouping:'always'});}
function money(n,c){return fmt(n)+' '+(c==='CUP'?'CUP':'USD');}
function curPick(k){return k==='CUP'?'CUP':'USD';}
function pcur(p){return curPick(p&&p.cur);}
function wcur(w){return curPick(w&&w.cur);}
function curSelect(id,val,name){return '<select id="'+id+'" name="'+(name||'cur')+'"><option value="USD"'+(val==='USD'?' selected':'')+'>USD</option><option value="CUP"'+(val==='CUP'?' selected':'')+'>CUP</option></select>';}
function sums(list,fn){var o={USD:0,CUP:0};list.forEach(function(x){o[curPick(x.cur)]+=fn(x);});return o;}
function bigs(o){var out='';if(o.USD)out+='<div class="big">'+fmt(o.USD)+' <span class="cc">USD</span></div>';if(o.CUP||!o.USD)out+='<div class="big">'+fmt(o.CUP)+' <span class="cc">CUP</span></div>';return out;}
function paidStr(o,def){var a=[];if(o.USD)a.push(money(o.USD,'USD'));if(o.CUP)a.push(money(o.CUP,'CUP'));return a.length?a.join('<br>'):money(0,def);}
function conv(v,from,to){if(from===to)return v;var r=D.rate;if(!(r>0))return NaN;return r2(from==='USD'?v*r:v/r);}
function pset(p,t){return (t==='mayor'?p.pm:p.pr)||{};}
function explicit(p,c,t){var v=Number(pset(p,t)[c]);return v>0?v:0;}
function mayorOn(){return (STORES[S.store||'moto']||{}).mayor!==false;}
function hasMayor(p){return explicit(p,'USD','mayor')>0||explicit(p,'CUP','mayor')>0;}
function effT(p,t){return t==='mayor'&&hasMayor(p)?'mayor':'normal';}
function priceIn(p,c,t){
  var te=effT(p,t),e=explicit(p,c,te);if(e>0)return e;
  var o=c==='USD'?'CUP':'USD',eo=explicit(p,o,te);return eo>0?conv(eo,o,c):NaN;
}
function sellUnit(p,c,t){return priceIn(p,c,t);}
function priceLines(p,t){var te=effT(p,t);return ['USD','CUP'].map(function(c){var e=explicit(p,c,te);if(e>0)return {c:c,v:e,est:false};var v=priceIn(p,c,t);return isFinite(v)?{c:c,v:v,est:true}:null;}).filter(Boolean);}
function priceStr(p,sep,onlyExplicit,t){return priceLines(p,t).filter(function(x){return !onlyExplicit||!x.est;}).map(function(x){return (x.est?'≈ ':'')+money(x.v,x.c);}).join(sep);}
function defSell(p,t){var te=effT(p,t),u=explicit(p,'USD',te)>0,c=explicit(p,'CUP',te)>0;if(u&&!c)return 'USD';if(c&&!u)return 'CUP';return S.lastSell||'USD';}

function fb(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<str.length;i++){var c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);}
async function hashPw(pw,salt,forceFb){
  if(!forceFb){
    try{
      var enc=new TextEncoder();
      var key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
      var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},key,256);
      return 'p:'+Array.from(new Uint8Array(bits),function(b){return p2(b.toString(16));}).join('');
    }catch(e){}
  }
  return 'f:'+fb(salt+pw);
}
async function verify(u,pw){var h=await hashPw(pw,u.salt,u.hash.slice(0,2)==='f:');return h===u.hash;}

function filtered(){var q=S.q.trim().toLowerCase();return D.products.filter(function(p){return (!S.cat||catOf(p)===S.cat)&&(!q||(p.name+' '+(p.code||'')).toLowerCase().indexOf(q)>-1);}).sort(cmpName);}

/* ventas */
function saleGroups(day){
  var map={},arr=[];
  D.moves.forEach(function(m){
    if(m.type!=='venta'||ymd(m.ts)!==day)return;
    var k=m.sid||m.id,g=map[k];
    if(!g){g=map[k]={sid:k,ts:m.ts,uname:m.uname,uid:m.uid,kind:m.kind==='mayor'?'mayor':'normal',client:m.client||'',lines:[]};arr.push(g);}
    g.lines.push(m);
  });
  arr.forEach(function(g){
    g.live=g.lines.filter(function(x){return !x.void;});
    g.void=g.live.length===0;
    g.total=rr(sums(g.live,function(x){return x.qty*x.price;}));
    g.units=g.live.reduce(function(a,x){return a+x.qty;},0);
    g.edited=g.lines.some(function(x){return x.edited;});
  });
  return arr.sort(function(a,b){return b.ts-a.ts;});
}
function lockedFor(day){return !!(D.closed&&D.closed[day])&&!isM();}
function billMsg(any,sum,tot,hasTot){
  if(!any)return ['note info','Escribe cuántos billetes hay de cada denominación.'];
  if(!hasTot)return ['note info','Importe contado: '+money(sum,'CUP')+'.'];
  var diff=r2(sum-tot);
  if(diff===0)return ['note ok','✓ El importe cuadra con la venta ('+money(tot,'CUP')+').'];
  if(diff>0)return ['note warn','Hay diferencia: sobran '+money(diff,'CUP')+' respecto al importe de la venta ('+money(tot,'CUP')+').'];
  return ['note bad','Hay diferencia: faltan '+money(-diff,'CUP')+' para cubrir la venta ('+money(tot,'CUP')+').'];
}
function qinHTML(p,ln){return '<input class="qin'+(ln.over?' over':'')+'" inputmode="decimal" data-cart="qty" data-id="'+p.id+'" data-max="'+p.stock+'" data-ov="ov-'+p.id+'" value="'+esc(ln.qty)+'" aria-label="Cantidad de '+esc(p.name)+'">';}
function cartLines(){return S.cart.lines.map(function(l){return {l:l,p:byId(D.products,l.pid)};}).filter(function(x){return x.p;});}
function cartOkCur(c){var ls=cartLines();return ls.length>0&&ls.every(function(x){return isFinite(priceIn(x.p,c,S.cart.kind));});}
function cartCur(){
  var c=S.cart.cur;if(c&&cartOkCur(c))return c;
  var order=S.lastSell==='CUP'?['CUP','USD']:['USD','CUP'];
  for(var i=0;i<order.length;i++){if(cartOkCur(order[i]))return order[i];}
  return '';
}
function cartTotal(c){return cartLines().reduce(function(a,x){return a+(Number(x.l.qty)||0)*priceIn(x.p,c,S.cart.kind);},0);}
function cartInner(){
  var cl=cartLines(),k=S.cart.kind,c=cartCur();
  var h=!mayorOn()?'':'<div class="chips sm" role="group" aria-label="Tipo de venta">'
    +'<button type="button" class="chip'+(k==='normal'?' on':'')+'" data-act="cartKind" data-kind="normal" aria-pressed="'+(k==='normal')+'">Normal</button>'
    +'<button type="button" class="chip'+(k==='mayor'?' on':'')+'" data-act="cartKind" data-kind="mayor" aria-pressed="'+(k==='mayor')+'">Al por mayor</button></div>';
  if(k==='mayor')h+='<input class="search" style="min-height:42px;margin-bottom:8px" id="cart-client" data-cart="client" list="clients" value="'+esc(S.cart.client)+'" autocomplete="off" placeholder="Cliente (opcional)" aria-label="Cliente"><datalist id="clients">'+clientOpts()+'</datalist>';
  if(!cl.length)return h+'<div class="small muted">Busca un producto o toca el ícono de lista para agregarlo.</div>';
  h+='<div class="list">'+cl.map(function(x){
    var u=c?priceIn(x.p,c,k):NaN;
    return '<div class="row cartrow"><div class="grow"><div class="nm">'+esc(x.p.name)+'</div><div class="sb num">'+(isFinite(u)?money(u,c)+' c/u':'—')+' · hay '+fmt(x.p.stock)+'</div><div class="sb bad" id="ov-'+x.p.id+'"'+(x.l.over?'':' hidden')+'>Solo hay '+fmt(x.p.stock)+' en existencia</div></div>'
      +'<div class="qtybox"><button type="button" class="btn sm" data-act="cartQty" data-id="'+x.p.id+'" data-d="-1" aria-label="Quitar uno de '+esc(x.p.name)+'">−</button>'+qinHTML(x.p,x.l)+'<button type="button" class="btn sm" data-act="cartQty" data-id="'+x.p.id+'" data-d="1" aria-label="Agregar uno de '+esc(x.p.name)+'">+</button></div></div>';
  }).join('')+'</div>';
  var okU=cartOkCur('USD'),okC=cartOkCur('CUP');
  h+='<div class="cartfoot"><div class="chips sm" role="group" aria-label="Moneda del cobro" style="padding:0">'+['USD','CUP'].map(function(m2){var ok=m2==='USD'?okU:okC;return '<button type="button" class="chip'+(c===m2?' on':'')+'" data-act="cartCur" data-cur="'+m2+'"'+(ok?'':' disabled')+' aria-pressed="'+(c===m2)+'">'+m2+'</button>';}).join('')+'</div><div class="tot" id="cart-total">'+(c?money(r2(cartTotal(c)),c):'—')+'</div></div>';
  if(!okU&&!okC)h+='<div class="note warn" style="margin-bottom:8px">Estos productos no tienen precio en una misma moneda. Pon el precio que falta o define la tasa de cambio.</div>';
  else if(!okU||!okC)h+='<div class="small muted" style="margin-bottom:6px">Para cobrar en '+(okU?'CUP':'USD')+' falta algún precio o la tasa de cambio.</div>';
  h+='<div class="actions"><button type="button" class="btn sm" data-act="cartClear">Vaciar</button><button type="button" class="btn primary" data-act="checkout"'+(c?'':' disabled')+'>Cobrar</button></div>';
  return h;
}

function pcLine(x,ch){

}
function pchHTML(x){return (x.pch||[]).map(function(ch){return pcLine(x,ch);}).join('');}
function pchSale(g){return g.lines.filter(function(x){return !x.void;}).map(pchHTML).join('');}
function pchText(list){
  var L=[];
  list.forEach(function(x){(x.pch||[]).forEach(function(ch){L.push('  - '+x.pname+': antes '+money(ch.from,ch.fromCur)+(ch.inv?' · inventario '+money(ch.inv.v,ch.inv.c):'')+' · venta '+money(ch.to,ch.toCur)+' · motivo: '+ch.why+' ('+ch.uname+')');});});
  return L;
}
function pcChanged(f){
  var ch=false;
  Array.prototype.forEach.call(f.querySelectorAll('input[data-pc]'),function(i){if(String(i.value).trim()!==i.dataset.orig)ch=true;});
  Array.prototype.forEach.call(f.querySelectorAll('select[name^="c_"]'),function(se){var o=Array.prototype.filter.call(se.options,function(x){return x.defaultSelected;})[0];if(o&&se.value!==o.value)ch=true;});
  var b=f.querySelector('#es-why-box');if(b)b.hidden=!ch;
}
function saleRow(g,lock){
  var multi=g.lines.length>1;
  var title=multi?plural(g.lines.length,'producto','productos'):fmt(g.lines[0].qty)+' × '+esc(g.lines[0].pname);
  var lines=multi?g.lines.map(function(x){return '<div class="sb'+(x.void?' void':'')+'">'+fmt(x.qty)+' × '+esc(x.pname)+'</div>';}).join(''):'';
  return '<div class="row sale'+(g.void?' void':'')+'"><div class="grow"><div class="nm" style="white-space:normal">'+title+'</div>'+lines
    +'<div class="sb">'+hm(g.ts)+(g.kind==='mayor'?' · Por mayor':'')+(g.client?' · '+esc(g.client):'')+' · '+esc(g.uname)+(g.void?' · anulada':g.edited?' · editada':'')+'</div></div>'
    +'<div class="right num">'+amt2(g.total,'')+'</div>'
    +'<button class="btn sm" data-act="editSale" data-id="'+g.sid+'">'+(g.void||lock?'Ver':'Editar')+'</button>'+pchSale(g)+'</div>';
}
function sellHTML(u){
  var today=ymd(Date.now()),adm=isM();
  if(!adm)S.vday=today;
  var day=S.vday||today,isT=day===today,lock=lockedFor(day);
  var gs=saleGroups(day),live=gs.filter(function(g){return !g.void;});
  var all=live.reduce(function(a,g){return a.concat(g.live);},[]);
  var units=live.reduce(function(a,g){return a+g.units;},0);
  var h='<h1 class="sr">Ventas</h1>';
  if(adm)h+='<div class="monthnav sm"><button class="btn sm" data-act="vdayPrev" aria-label="Día anterior">‹</button><span class="lbl">'+(isT?'Hoy · ':'')+dlong(dateToTs(day))+'</span><button class="btn sm" data-act="vdayNext" aria-label="Día siguiente"'+(isT?' disabled':'')+'>›</button></div>'
    +(isT?'':'<button class="btn sm block" data-act="vdayToday">Volver a hoy</button>');
  h+='<div class="mini"><div><small>'+(isT?'Vendido hoy':'Vendido este día')+'</small><div class="num">'+paidInline(rr(sums(all,function(x){return x.qty*x.price;})),'CUP')+'</div></div><div class="sub">'+plural(live.length,'venta','ventas')+'<br>'+fmt(units)+' '+(units===1?'unidad':'unidades')+'</div></div>';
  if(D.closed[day])h+='<div class="note ok">✓ Cuadre confirmado'+(D.closed[day].uname?' por '+esc(D.closed[day].uname):'')+'.'+(lock?' Ya no se pueden registrar ni editar ventas de este día.':' Como administrador puedes seguir editando.')+'</div>';
  if(lock){
    /* sin panel de venta */
  }else{
    if(!isT)h+='<div class="note info">Estás agregando una venta al '+dlong(dateToTs(day))+' (corrección del administrador).</div>';
    h+='<div id="cart" class="cart">'+cartInner()+'</div>'
    +'<div class="bar"><input class="search" type="search" placeholder="Nombre o ID" aria-label="Buscar producto por nombre o ID" data-search="sell" value="'+esc(S.q)+'" autocomplete="off"><button type="button" class="btn iconbtn'+(S.invOpen?' on':'')+'" data-act="invToggle" aria-expanded="'+(!!S.invOpen)+'" aria-label="Mostrar u ocultar la lista de inventario" title="Lista de inventario">'+svg('list',24)+'</button></div>'
    +'<div id="sell-inv">'+sellInvHTML()+'</div>';
  }
  h+='<div class="sec" style="margin:4px 0 0">Ventas '+(isT?'de hoy':'del día')+'</div>';
  if(!gs.length)h+='<div class="empty">'+(isT?'Aún no hay ventas hoy.':'No hubo ventas este día.')+'</div>';
  else h+='<div class="list">'+gs.map(function(g){return saleRow(g,lock);}).join('')+'</div>';
  return h;
}

    var out=p.stock<=0,ln=S.cart.lines.filter(function(x){return x.pid===p.id;})[0];

  +'<div class="sec" style="margin:6px 0 0">Pagos del mes</div>';

  else h+='<div class="list">'+pays.map(function(p){

  else h+='<div class="list">'+D.workers.slice().sort(cmpName).map(function(w){

function shiftDay(d,n){var a=d.split('-').map(Number);return ymd(new Date(a[0],a[1]-1,a[2]+n,12,0,0).getTime());}
function rr(o){return {USD:r2(o.USD),CUP:r2(o.CUP)};}
function add3(a,b,k){return {USD:a.USD+k*b.USD,CUP:a.CUP+k*b.CUP};}
function countSales(list){var k={};list.forEach(function(x){k[x.sid||x.id]=1;});return Object.keys(k).length;}
function cuadre(day){
  var isT=day===ymd(Date.now());
  var sales=D.moves.filter(function(m){return m.type==='venta'&&!m.void&&ymd(m.ts)===day;});
  var sN=sales.filter(function(x){return x.kind!=='mayor';}),sM=sales.filter(function(x){return x.kind==='mayor';});
  var f=function(x){return x.qty*x.price;};
  var normal=rr(sums(sN,f)),mayor=rr(sums(sM,f)),ventas=rr(add3(normal,mayor,1));
  var exps=D.expenses.filter(function(e){return ymd(e.ts)===day;}).sort(function(a,b){return b.ts-a.ts;});
  var gastos=rr(sums(exps,function(e){return e.amount;}));
  var paid=D.payments.filter(function(p){return ymd(p.ts)===day;});
  var pagados=rr(sums(paid,function(p){return p.amount;}));
  var pend=[],porPagar={USD:0,CUP:0};
  /* los salarios del día se registran en el cuadre; ya no hay «por pagar» automático */
  porPagar=rr(porPagar);
  var salarios=rr(add3(pagados,porPagar,1));
  var caja=rr(add3(add3(ventas,gastos,-1),salarios,-1));
  return {isT:isT,normal:normal,mayor:mayor,ventas:ventas,nN:countSales(sN),nM:countSales(sM),exps:exps,gastos:gastos,paid:paid,pagados:pagados,pend:pend,porPagar:porPagar,salarios:salarios,caja:caja};
}
function amt2(o,sign){var a=[];if(o.USD)a.push(sign+money(Math.abs(o.USD),'USD'));if(o.CUP)a.push(sign+money(Math.abs(o.CUP),'CUP'));return a.length?a.join('<br>'):'0';}
function amtLine(o){var a=[];if(o.USD)a.push(money(o.USD,'USD'));if(o.CUP)a.push(money(o.CUP,'CUP'));return a.length?a.join(' + '):'0';}
function lrow(label,sub,right){return '<div class="row"><div class="grow"><div class="nm">'+label+'</div><div class="sb">'+sub+'</div></div><div class="right num">'+right+'</div></div>';}

/* ---------- informe de inventario ---------- */
var PERIODS=[['hoy','Hoy'],['7','7 días'],['30','30 días'],['todo','Todo']];
function periodStart(k){
  var n=new Date();
  if(k==='hoy')return new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  if(k==='7')return new Date(n.getFullYear(),n.getMonth(),n.getDate()-6).getTime();
  if(k==='30')return new Date(n.getFullYear(),n.getMonth(),n.getDate()-29).getTime();
  return 0;
}
function pr2(o){var a=[];if(o&&o.USD>0)a.push(money(o.USD,'USD'));if(o&&o.CUP>0)a.push(money(o.CUP,'CUP'));return a.length?a.join(' / '):'sin precio';}
function informeText(k){
  var t0=periodStart(k),L=[],ps=D.products.slice().sort(cmpName);
  var lbl=PERIODS.filter(function(x){return x[0]===k;})[0][1];
  var inP=function(m){return m.ts>=t0;};
  L.push('INFORME DE INVENTARIO · '+shopName());
  L.push(dlong(Date.now())+' '+hm(Date.now())+' · Período: '+lbl);
  var units=ps.reduce(function(a,p){return a+p.stock;},0),val={USD:0,CUP:0};
  ps.forEach(function(p){['USD','CUP'].forEach(function(c){var v=priceIn(p,c,'normal');if(isFinite(v))val[c]+=p.stock*v;});});
  var out=ps.filter(function(p){return p.stock<=0;}),low=ps.filter(isLow);
  L.push('');L.push('RESUMEN');
  L.push('Productos: '+ps.length+' · Unidades en existencia: '+fmt(units));
  L.push('Valor en venta (precio normal): '+amtLine(rr(val)));
  L.push('Agotados: '+out.length+' · Con poca existencia: '+low.length);
  if(out.length){L.push('');L.push('AGOTADOS');out.forEach(function(p){L.push('- '+p.name+(p.code?' ('+p.code+')':''));});}
  if(low.length){L.push('');L.push('POCA EXISTENCIA');low.forEach(function(p){L.push('- '+p.name+(p.code?' ('+p.code+')':'')+': quedan '+fmt(p.stock)+' (aviso en '+fmt(p.min)+')');});}
  L.push('');L.push('EXISTENCIAS');
  if(!ps.length)L.push('No hay productos.');
  CATS.forEach(function(c){
    var l=ps.filter(function(p){return catOf(p)===c[0];});if(!l.length)return;
    L.push(c[1]+':');
    l.forEach(function(p){L.push('- '+p.name+(p.code?' ('+p.code+')':'')+': '+fmt(p.stock)+' · '+(mayorOn()?'Normal ':'')+pr2(p.pr)+(mayorOn()&&hasMayor(p)?' · Mayor '+pr2(p.pm):'')+((p.colors&&p.colors.length)?' · Colores: '+colorNames(p):''));});
  });
  var mv=D.moves.filter(function(m){return inP(m)&&!m.void;});
  var ent=mv.filter(function(m){return m.type==='entrada';}).sort(function(a,b){return a.ts-b.ts;});
  L.push('');L.push('ENTRADAS ('+lbl.toLowerCase()+')');
  if(!ent.length)L.push('Sin entradas.');
  ent.forEach(function(m){L.push('- '+dshort(m.ts)+' · '+m.pname+': +'+fmt(m.qty)+(m.note?' ('+m.note+')':'')+' · '+m.uname);});
  var baj=mv.filter(function(m){return m.type==='baja';}).sort(function(a,b){return a.ts-b.ts;});
  L.push('');L.push('BAJAS ('+lbl.toLowerCase()+')');
  if(!baj.length)L.push('Sin bajas.');
  baj.forEach(function(m){L.push('- '+dshort(m.ts)+' · '+m.pname+': −'+fmt(m.qty)+(m.note?' ('+m.note+')':'')+' · '+m.uname);});
  var sold={};mv.filter(function(m){return m.type==='venta';}).forEach(function(m){var o=sold[m.pid]||(sold[m.pid]={name:m.pname,q:0,USD:0,CUP:0});o.q+=m.qty;o[curPick(m.cur)]+=m.qty*m.price;});
  var sl=Object.keys(sold).map(function(k2){return sold[k2];}).sort(function(a,b){return b.q-a.q;});
  L.push('');L.push('VENTAS POR PRODUCTO ('+lbl.toLowerCase()+')');
  if(!sl.length)L.push('Sin ventas.');
  sl.forEach(function(o){L.push('- '+o.name+': '+fmt(o.q)+' u. · '+amtLine(rr({USD:o.USD,CUP:o.CUP})));});
  var ch=[];
  D.products.forEach(function(p){(p.hist||[]).forEach(function(h){if(h.ts>=t0)ch.push({p:p,h:h});});});
  ch.sort(function(a,b){return a.h.ts-b.h.ts;});
  L.push('');L.push('CAMBIOS DE PRECIO ('+lbl.toLowerCase()+')');
  if(!ch.length)L.push('Sin cambios de precio registrados.');
  ch.forEach(function(x){
    var h=x.h,parts=[];
    if(JSON.stringify(h.oldN)!==JSON.stringify(h.newN))parts.push('Normal: '+pr2(h.oldN)+' → '+pr2(h.newN));
    if(mayorOn()&&JSON.stringify(h.oldM)!==JSON.stringify(h.newM))parts.push('Mayor: '+pr2(h.oldM)+' → '+pr2(h.newM));
    L.push('- '+dshort(h.ts)+' · '+x.p.name+' · '+parts.join(' | ')+' · '+h.uname);
  });
  var vd=D.moves.filter(function(m){return inP(m)&&m.type==='venta'&&m.void;});
  if(vd.length){L.push('');L.push('VENTAS ANULADAS ('+lbl.toLowerCase()+'): '+countSales(vd));}
  return L.join('\n');
}

function salesDayData(day){
  var live=D.moves.filter(function(m){return m.type==='venta'&&!m.void&&ymd(m.ts)===day;});
  var P={},U={};
  live.forEach(function(m){
    var pr=byId(D.products,m.pid),o=P[m.pid]||(P[m.pid]={name:m.pname,code:pr?pr.code||'':'',q:0,qN:0,qM:0,USD:0,CUP:0,sids:{}});
    var amt=m.qty*m.price,cc=curPick(m.cur);
    o.q+=m.qty;if(m.kind==='mayor')o.qM+=m.qty;else o.qN+=m.qty;o[cc]+=amt;o.sids[m.sid||m.id]=1;
    var u=U[m.uid]||(U[m.uid]={name:m.uname,q:0,USD:0,CUP:0,sids:{}});u.q+=m.qty;u[cc]+=amt;u.sids[m.sid||m.id]=1;
  });
  var prods=Object.keys(P).map(function(k){var o=P[k];o.n=Object.keys(o.sids).length;return o;}).sort(function(a,b){return b.q-a.q||a.name.localeCompare(b.name,'es');});
  var users=Object.keys(U).map(function(k){var o=U[k];o.n=Object.keys(o.sids).length;return o;}).sort(function(a,b){return a.name.localeCompare(b.name,'es');});
  return {prods:prods,users:users,total:rr(sums(live,function(x){return x.qty*x.price;})),units:live.reduce(function(a,m){return a+m.qty;},0),nSales:countSales(live)};
}

function renderModal(){$('#modal').innerHTML=S.modal?modalHTML(S.modal):'';enhancePw();if(S.modal&&S.modal.t==='billtool')updateTool();}
function openModal(m){S.modal=m;S.confirm='';renderModal();var f=$('#modal input:not([type=hidden])');if(f&&m.t!=='checkout'&&m.t!=='billtool'&&m.t!=='editSale'&&m.t!=='product'&&m.t!=='worker'&&m.t!=='backupText')try{f.focus();}catch(e){}}
function closeModal(){S.modal=null;S.confirm='';render();}

function render(){
  var root=$('#app'),u=cur();
  if(u&&u.role==='seller'&&S.store!==u.store)useStore(u.store);
  applyTheme(u&&S.store?S.store:'');
  if(!G.users.length){root.innerHTML=setupHTML();$('#wrap').className='wrap noNav';}
  else if(!u){root.innerHTML=loginHTML();$('#wrap').className='wrap noNav';}
  else if(u.role!=='seller'&&!S.store){root.innerHTML=pickHTML(u);$('#wrap').className='wrap noNav';}
  else root.innerHTML=appHTML(u);
  renderModal();
}
function refresh(){render();}

/* ---------- acciones ---------- */
function ask(key){if(S.confirm===key){S.confirm='';return true;}S.confirm=key;refresh();return false;}
function needRoot(){if(!isRoot()){toast('Solo un administrador puede hacer esto.');return false;}return true;}
function needMaster(){if(!isM()){toast('Solo el administrador puede hacer esto.');return false;}return true;}
function login(u){S.uid=u.id;try{sessionStorage.setItem(SKEY,u.id);}catch(e){}if(u.role!=='seller')leaveStore();else useStore(u.store);S.day='';S.tab=u.role!=='seller'?'inv':'sell';S.q='';S.cat='';S.confirm='';S.cart=newCart('normal');S.vday='';render();window.scrollTo(0,0);}
function logMove(type,p,qty,note,extra){
  var u=cur();
  var mv=Object.assign({id:uid(),ts:Date.now(),type:type,pid:p.id,pname:p.name,qty:qty,price:0,cur:'USD',uid:u.id,uname:u.name,note:note||''},extra||{});
  D.moves.push(mv);return mv;
}

var A={
  tab:function(el){S.tab=el.dataset.tab;if(S.tab==='cua')S.day=ymd(Date.now());if(S.tab==='sell')S.vday=ymd(Date.now());S.q='';S.cat='';S.confirm='';render();window.scrollTo(0,0);},

  scrim:function(el,e){if(e.target===el)closeModal();},
  closeModal:function(){closeModal();},
  newProduct:function(){if(needMaster())openModal({t:'newProduct'});},
  openProduct:function(el){if(needMaster())openModal({t:'product',id:el.dataset.id});},
  addCart:function(el){
    var p=byId(D.products,el.dataset.id);if(!p)return;
    if(p.stock<=0){toast('Agotado');return;}
    var ln=S.cart.lines.filter(function(x){return x.pid===p.id;})[0];
    if(ln){
      if((Number(ln.qty)||0)+1>p.stock){ln.over=true;renderCart();toast('Solo quedan '+fmt(p.stock)+' de '+p.name);return;}
      ln.qty=r3((Number(ln.qty)||0)+1);ln.over=false;
    }else S.cart.lines.push({pid:p.id,qty:S.cart.kind==='mayor'?Math.min(10,p.stock):1});
    renderCart();refreshSellList();toast('Agregado: '+p.name+(ln?' ×'+fmt(ln.qty):''));
  },
  cartQty:function(el){
    var ln=S.cart.lines.filter(function(x){return x.pid===el.dataset.id;})[0],p=byId(D.products,el.dataset.id);if(!ln||!p)return;
    var q=r3((Number(ln.qty)||0)+Number(el.dataset.d));
    if(q<=0)S.cart.lines=S.cart.lines.filter(function(x){return x!==ln;});
    else if(q>p.stock){ln.over=true;renderCart();toast('Solo quedan '+fmt(p.stock)+' de '+p.name);return;}
    else{ln.qty=q;ln.over=false;}
    renderCart();refreshSellList();
  },
  billUp:function(el){var i=document.getElementById(el.dataset.for);if(!i)return;var n=parseInt(i.value,10);if(!(n>=0))n=0;if(n<99999)i.value=String(n+1);billSync(i);i.dispatchEvent(new Event('input',{bubbles:true}));},
  billDn:function(el){var i=document.getElementById(el.dataset.for);if(!i)return;var n=parseInt(i.value,10);if(!(n>0))return;n-=1;i.value=n>0?String(n):'';billSync(i);i.dispatchEvent(new Event('input',{bubbles:true}));},
  toggleSales:function(){S.cuaSales=!cuaOpen();try{localStorage.setItem(KEY_UI,JSON.stringify({cuaSales:S.cuaSales}));}catch(e){}refresh();},
  cartKind:function(el){var nk=el.dataset.kind==='mayor'&&mayorOn()?'mayor':'normal';if(nk==='mayor'&&S.cart.kind!=='mayor')S.cart.lines.forEach(function(l){var p=byId(D.products,l.pid);if(p&&Number(l.qty)===1)l.qty=Math.min(10,p.stock);});S.cart.kind=nk;S.cart.cur='';renderCart();refreshSellList();},
  cartCur:function(el){S.cart.cur=el.dataset.cur;renderCart();},

  checkout:function(){
    var cl=cartLines(),c=cartCur();
    if(lockedFor(S.vday||ymd(Date.now()))){toast('El cuadre de este día está confirmado.');return;}
    if(!cl.length){toast('Agrega productos a la venta.');return;}
    if(!c){toast('No hay una moneda común para cobrar estos productos.');return;}
    for(var i=0;i<cl.length;i++){
      var x=cl[i],q=Number(x.l.qty)||0;
      if(!(q>0)){toast('Revisa la cantidad de '+x.p.name+'.');return;}
      if(q>x.p.stock){toast('Solo quedan '+fmt(x.p.stock)+' de '+x.p.name+'.');return;}
    }
    S.cart.cur=c;openModal({t:'checkout'});
  },

function readPhoto(file,cb){
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=360,k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
      var out='';
      try{c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',0.7);}catch(e){}
      cb(out);
    };
    img.onerror=function(){cb('');};
    img.src=String(rd.result);
  };
  rd.onerror=function(){cb('');};
  rd.readAsDataURL(file);
}

  pay:function(f){
    if(!needMaster())return;
    var w=byId(D.workers,f.dataset.id),v=new FormData(f),amt=num(v.get('amount')),ts=dateToTs(v.get('date')||ymd(Date.now())),note=String(v.get('note')||'').trim();
    if(!w)return;
    if(!isFinite(amt)||amt<=0)return err(f,'Escribe un monto mayor que cero.');
    D.payments.push({id:uid(),ts:ts,wid:w.id,wname:w.name,amount:r2(amt),cur:curPick(v.get('cur')),note:note});
    var d=new Date(ts);S.month={y:d.getFullYear(),m:d.getMonth()+1};
    save();closeModal();refresh();toast('Pago registrado');
  },
  newUser:async function(f){
    if(!needRoot())return;
    var v=new FormData(f),name=String(v.get('user')||'').trim(),pw=String(v.get('pw')||'');
    if(!name)return err(f,'Escribe un nombre de usuario.');
    if(pw.length<4)return err(f,'La clave debe tener al menos 4 caracteres.');
    if(G.users.some(function(u){return u.name.toLowerCase()===name.toLowerCase();}))return err(f,'Ya existe una cuenta con ese usuario.');
    var salt=rnd(8),hash=await hashPw(pw,salt);
    var isAdm=v.get('role')==='admin';G.users.push({id:uid(),name:name,role:isAdm?'admin':'seller',store:isAdm?'both':(v.get('store')==='jug'?'jug':'moto'),salt:salt,hash:hash});save();closeModal();refresh();toast(isAdm?'Administrador creado':'Cuenta creada');
  },
  resetPw:async function(f){
    if(!needRoot())return;
    var u=byId(G.users,f.dataset.id),pw=String(new FormData(f).get('pw')||'');
    if(!u||u.role==='master')return;
    if(pw.length<4)return err(f,'La clave debe tener al menos 4 caracteres.');
    u.salt=rnd(8);u.hash=await hashPw(pw,u.salt);save();closeModal();refresh();toast('Clave actualizada');
  },
  masterPw:async function(f){
    var u=cur();if(!u||u.role!=='master')return;
    var v=new FormData(f),old=String(v.get('old')||''),pw=String(v.get('pw')||''),pw2=String(v.get('pw2')||'');
    if(!(await verify(u,old)))return err(f,'La clave actual no es correcta.');
    if(pw.length<6)return err(f,'La clave nueva debe tener al menos 6 caracteres.');
    if(pw!==pw2)return err(f,'Las claves nuevas no coinciden.');
    u.salt=rnd(8);u.hash=await hashPw(pw,u.salt);save();closeModal();refresh();toast('Clave de administrador cambiada');
  }
};

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var fn=A[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();var fn=F[f.dataset.form];if(fn)fn(f,e);
});
document.addEventListener('input',function(e){
  var t=e.target,d=t.dataset||{};
  if(t.id==='tool-expect'){var c8=t.value.replace(/\D/g,'').slice(0,8);if(c8!==t.value)t.value=c8;}
  if(d.pc){var ff=t.closest('form');if(ff)pcChanged(ff);}
  if(d.search){
    S.q=t.value;
    if(d.search==='inv'){var box=$('#list-inv');if(box)box.innerHTML=invList();}
    else refreshSellList();
  }else if(d.bill){billSync(t);if(d.tool)updateTool();else updateBills();}
  else if(d.expect){updateTool();}
  else if(d.cart==='client'){S.cart.client=t.value;}
  else if(d.cart==='qty'){
    var over=clampMax(t);
    var ln=S.cart.lines.filter(function(x){return x.pid===d.id;})[0];
    if(ln){var q=num(t.value);ln.qty=isFinite(q)&&q>0?q:0;ln.over=over;cartTotals();}
  }
  else if(d.max!==undefined){clampMax(t);}
});
document.addEventListener('change',function(e){
  var t=e.target,d=t.dataset||{};
  if(t.name&&t.name.indexOf('c_')===0){var ff2=t.closest('form');if(ff2)pcChanged(ff2);}
  if(t.id==='u-role'){var sb=$('#u-storebox'),hp=$('#u-rolehelp');if(sb)sb.hidden=t.value!=='seller';if(hp)hp.textContent=t.value==='admin'?'Administrador: acceso total, igual que tú. Entra a las dos tiendas, maneja productos, ventas de cualquier día, cuadres, salarios, informes, cuentas y respaldos.':'Vendedor: registra y edita las ventas de hoy, hace el cuadre con los salarios del día y cambia la tasa. No crea productos ni edita días anteriores. Solo ve la tienda que le asignes.';return;}
  if(d.cart==='qty'){cartNorm(d.id);return;}
  if(t.id==='f-photo'||t.id==='f-photo-cam'){
    var pf=t.files&&t.files[0];t.value='';
    var m=S.modal,p=m&&m.t==='product'&&byId(D.products,m.id);
    if(!pf||!p||!isM())return;
    readPhoto(pf,function(out){
      if(!out){toast('No se pudo leer esa imagen.');return;}
      var old=PH[p.id];PH[p.id]=out;
      if(!savePh()){if(old)PH[p.id]=old;else delete PH[p.id];toast('No hay espacio para más fotos. Quita alguna foto o haz un respaldo.');return;}
      renderModal();toast('Foto guardada');
    });
    return;
  }
  if(t.id!=='f-restore')return;
  var file=t.files&&t.files[0];t.value='';
  if(!file||!isRoot())return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(String(rd.result));
      if(!o||!Array.isArray(o.users)||!(o.stores||Array.isArray(o.products))||!o.users.some(function(u){return u.role==='master';}))throw new Error('x');
      var ph=o.photos;delete o.photos;var b=fixData(o);b.photos=ph;S.pending=b;
      var np=0,nm=0;SKEYS.forEach(function(k){np+=b.stores[k].products.length;nm+=b.stores[k].moves.length;});
      openModal({t:'restore',np:np,nu:b.users.length,nm:nm});
    }catch(x){toast('Ese archivo no es un respaldo válido.');}
  };
  rd.onerror=function(){toast('No se pudo leer el archivo.');};
  rd.readAsText(file);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal)closeModal();});
/* Botón "atrás" del teléfono: cierra la ventana abierta o vuelve a la pestaña principal; en la principal no hace nada (la app nunca se cierra) */
(function(){
  function defTab(u){return u?(u.role!=='seller'?'inv':'sell'):'';}
  function guard(){try{history.pushState({adc:1},'');}catch(e){}}
  guard();
  document.addEventListener('pointerdown',function f(){document.removeEventListener('pointerdown',f,true);guard();},true);
  window.addEventListener('popstate',function(){
    guard();
    if(S.modal){closeModal();return;}
    var u=cur();
    if(u&&S.store&&S.tab!==defTab(u)){S.tab=defTab(u);S.q='';S.cat='';S.confirm='';render();window.scrollTo(0,0);}
  });
})();

window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.inst=e;if(cur()&&S.tab==='more'&&!S.modal)refresh();});
window.addEventListener('appinstalled',function(){S.inst=null;if(cur()&&S.tab==='more')refresh();});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&!window.Capacitor&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
loadPhAsync().then(function(){render();},function(){PH=loadPhLS();render();});
})();
